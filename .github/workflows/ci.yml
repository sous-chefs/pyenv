---
name: ci

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: write

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - almalinux-9
          - amazonlinux-2023
          - centos-stream-9
          - debian-12
          - debian-13
          - fedora-latest
          - opensuse-leap-16
          - oraclelinux-9
          - rockylinux-9
          - ubuntu-2004
          - ubuntu-2204
          - ubuntu-2404
        suite:
          - default
          - system-install
          - user-install
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: actionshub/chef-install@6.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
      - name: Diagnose Fedora package resolution
        if: failure() && matrix.os == 'fedora-latest'
        run: |
          for container in $(docker ps --format '{{.Names}}' | grep -- '-fedora-latest$'); do
            docker exec "$container" rpm -q git python3 python3-libdnf5 python3-dnf
            docker exec "$container" dnf repolist
            docker exec "$container" dnf repoquery --available --qf '%{name} %{evr} %{arch} %{repoid}' git
            docker exec "$container" python3 -c 'import libdnf5; b = libdnf5.base.Base(); b.load_config(); b.setup(); s = b.get_repo_sack(); s.create_repos_from_system_configuration(); s.load_repos(); q = libdnf5.rpm.PackageQuery(b); q.filter_name(["git"]); print([(p.get_nevra(), p.get_repo_id()) for p in q])'
          done
